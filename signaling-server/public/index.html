<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Screen Share</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"
        integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+"
        crossorigin="anonymous"></script>
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
    <div class="flex flex-col lg:flex-row gap-6 items-start">
        <!-- Video Container -->
        <div class="relative overflow-hidden rounded-2xl bg-gray-900 shadow-2xl border border-gray-800"
            style="width: 290px; height: 600px;">
            <div id="callOverlay" class="absolute inset-0 flex items-center justify-center z-10 bg-gray-900/80">
                <button id="callBtn"
                    class="bg-blue-600 hover:bg-blue-700 uppercase font-semibold text-white px-6 py-2 rounded-lg shadow-lg transition-all flex items-center gap-2">
                    <i class='bx bx-video'></i> 
                    Call
                </button>
            </div>
            <div class="absolute top-3 left-3 z-20">
                <div class="flex gap-2">
                    <div id="statusBadge"
                        class="px-2 py-1 rounded-full text-xs font-medium bg-gray-700 text-gray-300">
                        Disconnected
                    </div>
                </div>
                <div id="statsPanel"
                    class="mt-2 bg-black/40 backdrop-blur-sm rounded-lg px-2 py-1 text-xs font-mono text-white hidden">
                    <div class="flex items-center gap-3">
                        <span><span class="text-gray-400">FPS:</span> <span id="statsFps">0</span></span>
                        <span><span class="text-gray-400">Bitrate:</span> <span id="statsBitrate">0</span> kbps</span>
                    </div>
                </div>
            </div>
            <video autoplay playsinline class="h-full w-full object-cover"></video>
        </div>

        <!-- Settings Panel -->
        <div class="bg-gray-900 rounded-2xl p-5 shadow-2xl border border-gray-800 w-72">
            <h2 class="text-white font-semibold text-lg mb-4 flex items-center gap-2">
                <i class='bx bx-cog'></i> 
                Stream Settings
            </h2>

            <!-- Resolution -->
            <div class="mb-4">
                <label class="text-gray-400 text-sm mb-2 block">Resolution</label>
                <select id="resolution"
                    class="w-full bg-gray-800 text-white rounded-lg px-3 py-2 border border-gray-700 focus:border-blue-500 focus:outline-none">
                    <option value="0">Original</option>
                    <option value="1">480p (SD)</option>
                    <option value="2">720p (HD)</option>
                    <option value="3">1080p (FHD)</option>
                </select>
            </div>

            <!-- FPS -->
            <div class="mb-4">
                <label class="text-gray-400 text-sm mb-2 block">FPS</label>
                <div class="flex gap-2">
                    <button data-fps="15"
                        class="fps-btn flex-1 py-2 rounded-lg bg-gray-800 text-gray-400 border border-gray-700 hover:border-blue-500 transition-all">15</button>
                    <button data-fps="30"
                        class="fps-btn flex-1 py-2 rounded-lg bg-gray-800 text-gray-400 border border-gray-700 hover:border-blue-500 transition-all">30</button>
                    <button data-fps="60"
                        class="fps-btn flex-1 py-2 rounded-lg bg-gray-800 text-gray-400 border border-gray-700 hover:border-blue-500 transition-all">60</button>
                    <button data-fps="90"
                        class="fps-btn flex-1 py-2 rounded-lg bg-gray-800 text-gray-400 border border-gray-700 hover:border-blue-500 transition-all">90</button>
                </div>
            </div>

            <!-- Bitrate -->
            <div class="mb-4">
                <label class="text-gray-400 text-sm mb-2 block">
                    Bitrate: <span id="bitrateValue" class="text-white font-medium"></span> Mbps
                </label>
                <input type="range" id="bitrate" min="500" max="8000" step="500"
                    class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-600">
                <div class="flex justify-between text-xs text-gray-500 mt-1">
                    <span>0.5</span>
                    <span>8.0</span>
                </div>
            </div>

            <!-- Show Stats Toggle -->
            <div class="mb-4 flex items-center justify-between">
                <label class="text-gray-400 text-sm">Show Stats</label>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="statsToggle" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <!-- Apply Button -->
            <button id="applyBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                disabled>
                <i class='bx bx-refresh-ccw-alt'></i>
                Apply
            </button>
        </div>
    </div>

    <script>
        // Settings state
        const settings = {
            quality: 0,
            fps: 60,
            bitrate: 3000
        };

        /** @type {RTCPeerConnection} */
        let pc = null;
        /** @type {MediaStream} */
        let mediaStream = new MediaStream();
        let isRemoteDescriptionSet = false;
        let isConnected = false;
        const pendingIceCandidates = [];

        // DOM elements
        const video = document.querySelector('video');
        const callBtn = document.getElementById('callBtn');
        const callOverlay = document.getElementById('callOverlay');
        const statusBadge = document.getElementById('statusBadge');
        const resolutionSelect = document.getElementById('resolution');
        const fpsButtons = document.querySelectorAll('.fps-btn');
        const bitrateSlider = document.getElementById('bitrate');
        const bitrateValue = document.getElementById('bitrateValue');
        const applyBtn = document.getElementById('applyBtn');
        const statsPanel = document.getElementById('statsPanel');
        const statsFps = document.getElementById('statsFps');
        const statsBitrate = document.getElementById('statsBitrate');
        const statsToggle = document.getElementById('statsToggle');

        let statsInterval = null;
        let lastBytesReceived = 0;
        let lastTimestamp = 0;
        let showStats = true;

        bitrateSlider.value = settings.bitrate;
        bitrateValue.textContent = `${settings.bitrate / 1000}`;
        resolutionSelect.value = settings.quality;

        video.srcObject = mediaStream;

        // Socket.IO
        const socket = io(location.origin);

        socket.on("connect", () => {
            console.log("Connected:", socket.id);
        });

        socket.on("disconnect", () => {
            console.error("Socket IO Disconnected");
            updateStatus("Disconnected", "bg-gray-700", "text-gray-300");
        });

        socket.on("ice", async ({ candidate, sdpMLineIndex, sdpMid }) => {
            console.log("Received ICE candidate");
            await addIceCandidateSafely(candidate, sdpMLineIndex, sdpMid);
        });

        socket.on("offer", async ({ sdp }) => {
            pc && closePeerConnection();
            pc = createPeerConnection();

            try {
                await pc.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp }));
                isRemoteDescriptionSet = true;

                await applyPendingIceCandidates(pc);
                isRemoteDescriptionSet = false;

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                socket.emit("answer", { sdp: answer.sdp });
            } catch (error) {
                console.error("Error setting remote description:", error);
            }
        });

        // Settings handlers
        resolutionSelect.addEventListener('change', (e) => {
            settings.resolution = parseInt(e.target.value);
            enableApplyButton();
        });

        fpsButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                fpsButtons.forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    b.classList.add('bg-gray-800', 'text-gray-400', 'border-gray-700');
                });
                btn.classList.remove('bg-gray-800', 'text-gray-400', 'border-gray-700');
                btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                settings.fps = parseInt(btn.dataset.fps);
                enableApplyButton();
            });
        });

        bitrateSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            settings.bitrate = value;
            bitrateValue.textContent = (value / 1000).toFixed(1);
            enableApplyButton();
        });

        statsToggle.addEventListener('change', (e) => {
            showStats = e.target.checked;
            if (isConnected) {
                if (showStats) {
                    statsPanel.classList.remove('hidden');
                } else {
                    statsPanel.classList.add('hidden');
                }
            }
        });

        applyBtn.addEventListener('click', () => {
            socket.emit("settings_update", settings);
            applyBtn.disabled = true;
            applyBtn.innerHTML = `
                <i class='bx bx-checks text-green-400'></i>
                Applied!
            `;
            setTimeout(() => {
                applyBtn.innerHTML = `
                    <i class='bx bx-refresh-ccw-alt'></i>
                    Apply
                `;
            }, 3000);
        });

        function enableApplyButton() {
            if (isConnected) {
                applyBtn.disabled = false;
            }
        }

        callBtn.addEventListener('click', () => {
            callBtn.disabled = true;
            callBtn.innerHTML = `
                <div class="h-5 w-5 animate-spin rounded-full border-2 border-white border-t-transparent"></div>
                Connecting...
            `;

            socket.emit("permission_request", settings);

            setTimeout(() => {
                if (!isConnected) {
                    callBtn.disabled = false;
                    callBtn.innerHTML = `
                        <i class='bx bx-video'></i> 
                        Call
                    `;
                }
            }, 5000);
        });

        function updateStatus(text, bgClass, textClass) {
            statusBadge.className = `px-2 py-1 rounded-full text-xs font-medium ${bgClass} ${textClass}`;
            statusBadge.textContent = text;
        }



        function startStatsMonitor() {
            if (showStats) {
                statsPanel.classList.remove('hidden');
            }

            statsInterval = setInterval(async () => {
                if (!pc) return;
                const stats = await pc.getStats();
                stats.forEach(report => {
                    if (report.type === 'inbound-rtp' && report.kind === 'video') {
                        const now = report.timestamp;
                        const bytes = report.bytesReceived;

                        if (lastTimestamp > 0) {
                            const timeDiff = (now - lastTimestamp) / 1000;
                            const bytesDiff = bytes - lastBytesReceived;
                            const bitrate = Math.round((bytesDiff * 8) / timeDiff / 1000);
                            statsBitrate.textContent = bitrate;
                        }

                        if (report.framesPerSecond) {
                            statsFps.textContent = Math.round(report.framesPerSecond);
                        }

                        lastBytesReceived = bytes;
                        lastTimestamp = now;
                    }
                });
            }, 1000);
        }

        function stopStatsMonitor() {
            if (statsInterval) {
                clearInterval(statsInterval);
                statsInterval = null;
            }
            statsPanel.classList.add('hidden');
            lastBytesReceived = 0;
            lastTimestamp = 0;
        }

        function createPeerConnection() {
            const peerConnection = new RTCPeerConnection({
                iceServers: [
                    { urls: "stun:global.stun.twilio.com:3478" },
                    {
                        urls: "turn:openrelay.metered.ca:443?transport=udp",
                        username: "openrelayproject",
                        credential: "openrelayproject"
                    }
                ],
                bundlePolicy: "max-bundle",
                iceCandidatePoolSize: 10
            });

            peerConnection.ontrack = (event) => {
                for (const track of mediaStream.getVideoTracks()) {
                    mediaStream.removeTrack(track);
                }
                mediaStream.addTrack(event.track);
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit("ice_candidate", event.candidate);
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                console.info("Connection state:", peerConnection.iceConnectionState);

                switch (peerConnection.iceConnectionState) {
                    case "checking":
                        updateStatus("Connecting...", "bg-yellow-600", "text-white");
                        break;
                    case "connected":
                        isConnected = true;
                        callOverlay.classList.add('hidden');
                        updateStatus("Live", "bg-green-600", "text-white");
                        startStatsMonitor();
                        break;
                    case "disconnected":
                    case "failed":
                        isConnected = false;
                        stopStatsMonitor();
                        closePeerConnection();
                        callOverlay.classList.remove('hidden');
                        callBtn.disabled = false;
                        callBtn.innerHTML = `
                            <i class='bx bx-video'></i> 
                            Call
                        `;
                        updateStatus("Disconnected", "bg-gray-700", "text-gray-300");
                        applyBtn.disabled = true;
                        break;
                }
            };

            peerConnection.onsignalingstatechange = () => {
                console.info("Signaling state:", peerConnection.signalingState);
                if (peerConnection.signalingState === "closed") {
                    closePeerConnection();
                }
            };

            peerConnection.onicegatheringstatechange = () => {
                console.info("ICE gathering state:", peerConnection.iceGatheringState);
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    const { candidate, sdpMLineIndex, sdpMid } = event.candidate;
                    socket.emit("ice", { candidate, sdpMLineIndex, sdpMid });
                }
            };

            return peerConnection;
        }

        function closePeerConnection() {
            if (!pc) return;
            mediaStream.getTracks().forEach(track => track.stop());
            pc.getTransceivers().forEach(transceiver => transceiver.stop());
            pc.close();
            pc = null;
        }

        async function addIceCandidateSafely(candidate, sdpMLineIndex, sdpMid) {
            try {
                if (isRemoteDescriptionSet) {
                    await pc.addIceCandidate({ candidate, sdpMLineIndex, sdpMid });
                } else {
                    pendingIceCandidates.push({ candidate, sdpMLineIndex, sdpMid });
                }
            } catch (error) {
                console.error("Error adding ICE candidate:", error);
            }
        }

        async function applyPendingIceCandidates(peerConnection) {
            console.log(`Applying ${pendingIceCandidates.length} buffered ICE candidates`);
            for (const iceData of pendingIceCandidates) {
                try {
                    await peerConnection.addIceCandidate(iceData);
                } catch (error) {
                    console.error("Error applying buffered ICE candidate:", error);
                }
            }
            pendingIceCandidates.length = 0;
        }
    </script>
</body>

</html>
